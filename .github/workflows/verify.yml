name: Verificar entrega TacticalTrack
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: API/pom.xml
      - run: mvn -B -f API/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-api
          path: API/target/surefire-reports/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: chmod +x APP/gradlew
      - run: ./APP/gradlew -p APP testDebugUnitTest logicCoverageReport verifyLogicCoverage assembleDebug lintVitalRelease --no-daemon
      - name: Resumen de cobertura y pruebas
        run: |
          python3 scripts/resumen_cobertura.py --commit "${{ github.sha }}"
          cat evidencias-generadas/cobertura.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-y-cobertura-android
          path: |
            APP/app/build/reports/
            APP/app/build/test-results/testDebugUnitTest/
            evidencias-generadas/cobertura.md
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug-sin-firma-release
          path: APP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
